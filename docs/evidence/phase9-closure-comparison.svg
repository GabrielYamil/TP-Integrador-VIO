<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Mediana del error de cierre por estrategia</title>
  <desc id="desc">Comparación de error crudo y corregido estable. Off: 5,83 y 5,83 cm; Directo: 3,39 y 4,49 cm; Suavizado: 2,36 y 4,71 cm.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="600" fill="#172033">Error de cierre mediano por estrategia</text>
  <text x="450" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526079">Recorrido cerrado · tres repeticiones por estrategia</text>
  <g stroke="#d8dee9" stroke-width="1">
    <line x1="90" y1="410" x2="840" y2="410"/>
    <line x1="90" y1="330" x2="840" y2="330"/>
    <line x1="90" y1="250" x2="840" y2="250"/>
    <line x1="90" y1="170" x2="840" y2="170"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#526079" text-anchor="end">
    <text x="78" y="415">0</text>
    <text x="78" y="335">2</text>
    <text x="78" y="255">4</text>
    <text x="78" y="175">6</text>
  </g>
  <text x="28" y="260" transform="rotate(-90 28 260)" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526079">Error de cierre (cm)</text>
  <g>
    <rect x="175" y="177" width="62" height="233" rx="4" fill="#3977d3"/>
    <rect x="245" y="177" width="62" height="233" rx="4" fill="#e07a35"/>
    <rect x="405" y="274" width="62" height="136" rx="4" fill="#3977d3"/>
    <rect x="475" y="230" width="62" height="180" rx="4" fill="#e07a35"/>
    <rect x="635" y="316" width="62" height="94" rx="4" fill="#3977d3"/>
    <rect x="705" y="222" width="62" height="188" rx="4" fill="#e07a35"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#172033" text-anchor="middle">
    <text x="206" y="168">5,83</text><text x="276" y="168">5,83</text>
    <text x="436" y="265">3,39</text><text x="506" y="221">4,49</text>
    <text x="666" y="307">2,36</text><text x="736" y="213">4,71</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#172033" text-anchor="middle">
    <text x="241" y="438">Off</text>
    <text x="471" y="438">Directo</text>
    <text x="701" y="438">Suavizado</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#526079">
    <rect x="298" y="465" width="16" height="16" rx="3" fill="#3977d3"/><text x="322" y="478">Crudo</text>
    <rect x="465" y="465" width="16" height="16" rx="3" fill="#e07a35"/><text x="489" y="478">Corregido estable</text>
  </g>
</svg>
