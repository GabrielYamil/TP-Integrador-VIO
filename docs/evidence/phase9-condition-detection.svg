<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Tasa mediana de detección por condición</title>
  <desc id="desc">Distancia 1,20 m: 8,69 Hz; ángulo 45 grados: 7,98 Hz; iluminación baja: 7,48 Hz; oclusión parcial: 0 Hz.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="600" fill="#172033">Detección AprilTag bajo condiciones variables</text>
  <text x="450" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526079">Mediana de tres repeticiones por condición</text>
  <g stroke="#d8dee9" stroke-width="1">
    <line x1="90" y1="410" x2="840" y2="410"/>
    <line x1="90" y1="350" x2="840" y2="350"/>
    <line x1="90" y1="290" x2="840" y2="290"/>
    <line x1="90" y1="230" x2="840" y2="230"/>
    <line x1="90" y1="170" x2="840" y2="170"/>
    <line x1="90" y1="110" x2="840" y2="110"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#526079" text-anchor="end">
    <text x="78" y="415">0</text><text x="78" y="355">2</text><text x="78" y="295">4</text>
    <text x="78" y="235">6</text><text x="78" y="175">8</text><text x="78" y="115">10</text>
  </g>
  <text x="28" y="260" transform="rotate(-90 28 260)" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526079">Detecciones por segundo</text>
  <g fill="#31866f">
    <rect x="135" y="149" width="120" height="261" rx="4"/>
    <rect x="320" y="171" width="120" height="239" rx="4"/>
    <rect x="505" y="186" width="120" height="224" rx="4"/>
    <rect x="690" y="408" width="120" height="2" rx="1"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle">
    <text x="195" y="140">8,69</text><text x="380" y="162">7,98</text><text x="565" y="177">7,48</text><text x="750" y="399">0,00</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle">
    <text x="195" y="438">Distancia 1,20 m</text>
    <text x="380" y="438">Ángulo 45°</text>
    <text x="565" y="438">Luz baja</text>
    <text x="750" y="438">Oclusión 25 %</text>
  </g>
  <text x="450" y="476" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#526079">La oclusión parcial bloqueó la detección; el tracking WebXR permaneció al 100 %.</text>
</svg>
